name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: PowerShell input and history smoke test
        if: runner.os == 'Windows'
        run: npm run smoke:shell-integration
      - name: Electron end-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Electron end-to-end tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output-${{ runner.os }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run package
